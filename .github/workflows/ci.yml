name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.23"

jobs:
  check:
    name: vet, lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relab
          POSTGRES_PASSWORD: relab
          POSTGRES_DB: relab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relab"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # The integration tests create and drop their own databases against this
      # instance; they skip when it is unset.
      RELAB_TEST_DSN: postgres://relab:relab@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - run: go vet ./...

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Test
        run: go test -race -timeout 15m ./...
