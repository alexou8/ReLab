name: release

# A release is cut by pushing a tag. Nothing here runs on a branch push, so an
# ordinary merge cannot publish an artifact by accident.
on:
  push:
    tags: ["v*"]

# The tag is the input to every job, and the version it produces is written into
# the binary, the image and the checksum file, so an artifact can always say
# which tag it came from.
env:
  GO_VERSION: "1.25"

permissions:
  contents: read

jobs:
  # The gate runs again against the tagged commit. A release that skipped the
  # tests because "CI was green on the branch" is a release nobody checked.
  verify:
    name: verify the tagged commit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relab
          POSTGRES_PASSWORD: relab
          POSTGRES_DB: relab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      RELAB_TEST_DSN: postgres://relab:relab@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test ./test/scenarios/...
      - run: go test ./test/process/...

  binaries:
    name: binaries and checksums
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build every supported target
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          # -trimpath keeps the build machine's paths out of the binary, which
          # is both a privacy matter and the first requirement for a build
          # anyone else can reproduce.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="relab_${version}_${os}_${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "dist/${name}/relab" ./cmd/relab
            cp LICENSE README.md "dist/${name}/"
            tar -czf "dist/${name}.tar.gz" -C dist "${name}"
            rm -rf "dist/${name}"
          done

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > relab_${GITHUB_REF_NAME}_SHA256SUMS
          cat relab_${GITHUB_REF_NAME}_SHA256SUMS

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/relab_${{ github.ref_name }}_sbom.spdx.json
          upload-artifact: false

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error

  image:
    name: container image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

  publish:
    name: publish the release
    needs: [binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A pre-release tag (v1.0.0-rc.1) is published as one, so an rc never
          # appears as the latest stable release.
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease";; esac
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md).

          Verify a download against \`relab_${GITHUB_REF_NAME}_SHA256SUMS\`:

              sha256sum -c relab_${GITHUB_REF_NAME}_SHA256SUMS

          Container image: \`ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}\`" \
            ${prerelease}
